name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Check Formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Security Audit
        working-directory: rust
        run: cargo audit

  flutter-checks:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Check Formatting
        working-directory: app/flutter
        run: dart format --set-exit-if-changed lib/ test/
      # Bindings, analyze, and tests block; unused FRB API functions only add
      # warning annotations. See the top of the script.
      - name: FRB Checks
        run: bash scripts/check_frb.sh --allow-warnings

  # Mandatory platform build. Android, iOS, and Windows are built on demand by
  # manual-build.yml (Actions tab -> "Manual Platform Build" -> "Run workflow").
  native-linux:
    name: Build linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Dependencies
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
      - name: Build Linux
        working-directory: app/flutter
        run: flutter build linux --debug

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust-checks, flutter-checks, native-linux]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    permissions:
      contents: write
    strategy:
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Selective Release (Tag Suffix)
        id: filter
        run: |
          BUILD_TARGET="${{ matrix.target }}"
          SHOULD_BUILD="true"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG_NAME" == *-a ]] && [[ "$BUILD_TARGET" != "android" ]]; then
              SHOULD_BUILD="false"
            elif [[ "$TAG_NAME" == *-l ]] && [[ "$BUILD_TARGET" != "linux" ]]; then
              SHOULD_BUILD="false"
            fi
          fi
          
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
      
      - name: Install Flutter Dependencies
        if: steps.filter.outputs.should_build == 'true'
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        if: steps.filter.outputs.should_build == 'true'
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
          
      - name: Build Linux
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter
        run: flutter build linux --release
        
      - name: Compress Linux Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter/build/linux/x64/release/bundle
        run: tar -czvf "$GITHUB_WORKSPACE/qi_flutter_linux.tar.gz" *
        
      - name: Build Android
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Move Android Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: mv build/app/outputs/flutter-apk/app-release.apk ../../qi_flutter_android.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: steps.filter.outputs.should_build == 'true'
        with:
          files: |
            qi_flutter_linux.tar.gz
            qi_flutter_android.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
