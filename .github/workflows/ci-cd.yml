name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  rust-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Check Formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security Audit
        working-directory: rust
        run: cargo audit

  flutter-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
      - name: Check Formatting
        working-directory: app/flutter
        run: dart format --set-exit-if-changed lib/ test/
      - name: Analyze
        working-directory: app/flutter
        run: flutter analyze
      - name: Test
        working-directory: app/flutter
        run: flutter test

  frb-codegen-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0
      - name: Generate FRB Bindings
        working-directory: app/flutter
        run: flutter_rust_bridge_codegen generate
      - name: Check Generated Bindings
        run: git diff --ignore-all-space --ignore-blank-lines --exit-code -- app/flutter/lib/src/rust rust/crates/rust_lib_qi_flutter/src/frb_generated.rs

  rename-script-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Test project rename helper
        run: python3 -m unittest discover -s scripts/tests -v

  native-builds:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # iOS Simulator is best-effort: failures remain visible but do not fail
    # the workflow or block jobs that depend on native-builds.
    continue-on-error: ${{ matrix.target == 'ios-simulator' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          # Windows builds are currently disabled; uncomment to restore CI coverage.
          # - target: windows
          #   runner: windows-2022
          # macOS builds are currently disabled; uncomment to restore CI coverage.
          # - target: macos
          #   runner: macos-15
          - target: android
            runner: ubuntu-24.04
          # Optional, non-blocking iOS Simulator build. Comment out this matrix entry
          # to disable it; the platform project and local build instructions remain.
          - target: ios-simulator
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build pkg-config cmake build-essential

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter Dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: app/flutter
        run: flutter build linux --debug

      # Windows CI build is disabled; uncomment this step and its matrix entry above to restore it.
      # - name: Build Windows
      #   if: matrix.target == 'windows'
      #   working-directory: app/flutter
      #   run: flutter build windows --debug

      # macOS CI build is disabled; uncomment this step and its matrix entry above to restore it.
      # - name: Build macOS
      #   if: matrix.target == 'macos'
      #   working-directory: app/flutter
      #   run: flutter build macos --debug

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: app/flutter
        run: flutter build apk --debug

      - name: Build iOS Simulator
        if: matrix.target == 'ios-simulator'
        working-directory: app/flutter
        run: flutter build ios --simulator --no-codesign

  build-and-release:
    needs: [rust-checks, flutter-checks, frb-codegen-check, rename-script-checks, native-builds]
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Selective Release (Tag Suffix)
        id: filter
        run: |
          BUILD_TARGET="${{ matrix.target }}"
          SHOULD_BUILD="true"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG_NAME" == *-a ]] && [[ "$BUILD_TARGET" != "android" ]]; then
              SHOULD_BUILD="false"
            elif [[ "$TAG_NAME" == *-l ]] && [[ "$BUILD_TARGET" != "linux" ]]; then
              SHOULD_BUILD="false"
            fi
          fi
          
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
      
      - name: Install Linux Dependencies
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build pkg-config cmake build-essential
      
      - name: Install Flutter
        if: steps.filter.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install Rust & NDK Targets
        if: steps.filter.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android"
          
      - name: Build Linux
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter
        run: flutter build linux --release
        
      - name: Compress Linux Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter/build/linux/x64/release/bundle
        run: tar -czvf "$GITHUB_WORKSPACE/qi_flutter_linux.tar.gz" *
        
      - name: Build Android
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: flutter build apk --release
        
      - name: Move Android Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: mv build/app/outputs/flutter-apk/app-release.apk ../../qi_flutter_android.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.filter.outputs.should_build == 'true'
        with:
          files: |
            qi_flutter_linux.tar.gz
            qi_flutter_android.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
