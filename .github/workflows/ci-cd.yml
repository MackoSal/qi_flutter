name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Check Formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Security Audit
        working-directory: rust
        run: cargo audit

  flutter-checks:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
      - name: Check Formatting
        working-directory: app/flutter
        run: dart format --set-exit-if-changed lib/ test/
      - name: Analyze
        working-directory: app/flutter
        run: flutter analyze
      - name: Test
        working-directory: app/flutter
        run: flutter test

  frb-codegen-check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Generate FRB Bindings
        working-directory: app/flutter
        run: flutter_rust_bridge_codegen generate
      - name: Check Generated Bindings
        run: git diff --ignore-all-space --ignore-blank-lines --exit-code -- app/flutter/lib/src/rust rust/crates/rust_lib_qi_flutter/src/frb_generated.rs

  rename-script-checks:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    steps:
      - uses: actions/checkout@v4
      - name: Test project rename helper
        run: python3 -m unittest discover -s scripts/tests -v

  native-linux-android:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
          - target: android
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter Dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: app/flutter
        run: flutter build linux --debug

      - name: Report Android disk usage before build
        if: matrix.target == 'android'
        working-directory: app/flutter
        run: |
          report="$GITHUB_WORKSPACE/android-disk-report.txt"
          {
            echo '## Disk space before build'
            df -h
            echo '## Major toolchain/build directories before build'
            for path in /opt/android-sdk "$HOME/.gradle/caches" /usr/local/cargo/registry /usr/local/rustup rust_builder/build build; do
              if [ -e "$path" ]; then du -sh "$path" || true; fi
            done
          } 2>&1 | tee "$report"

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: app/flutter
        run: flutter build apk --profile --target-platform android-arm64

      - name: Verify Android APK contains arm64 only
        if: matrix.target == 'android'
        working-directory: app/flutter
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-profile.apk
          test -f "$apk"
          abis=$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          test "$abis" = "arm64-v8a"
          printf 'Verified APK ABI: %s\n' "$abis"

      - name: Report Android disk usage after build
        if: always() && matrix.target == 'android'
        working-directory: app/flutter
        run: |
          report="$GITHUB_WORKSPACE/android-disk-report.txt"
          {
            echo '## Disk space after build'
            df -h
            echo '## Major toolchain/build directories after build'
            for path in /opt/android-sdk "$HOME/.gradle/caches" /usr/local/cargo/registry /usr/local/rustup rust_builder/build build; do
              if [ -e "$path" ]; then du -sh "$path" || true; fi
            done
          } 2>&1 | tee -a "$report"

      - name: Upload Android disk report
        if: always() && matrix.target == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: android-disk-report
          path: ${{ github.workspace }}/android-disk-report.txt
          if-no-files-found: ignore

  native-ios:
    name: Build iOS Simulator (optional)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Install Flutter Dependencies
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
      - name: Build iOS Simulator
        working-directory: app/flutter
        run: flutter build ios --simulator --no-codesign

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust-checks, flutter-checks, frb-codegen-check, rename-script-checks, native-linux-android, native-ios]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/mackosal/qi_flutter-devcontainer:1
    permissions:
      contents: write
    strategy:
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Selective Release (Tag Suffix)
        id: filter
        run: |
          BUILD_TARGET="${{ matrix.target }}"
          SHOULD_BUILD="true"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG_NAME" == *-a ]] && [[ "$BUILD_TARGET" != "android" ]]; then
              SHOULD_BUILD="false"
            elif [[ "$TAG_NAME" == *-l ]] && [[ "$BUILD_TARGET" != "linux" ]]; then
              SHOULD_BUILD="false"
            fi
          fi
          
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
      
      - name: Install Flutter Dependencies
        if: steps.filter.outputs.should_build == 'true'
        working-directory: app/flutter
        run: flutter pub get
      - name: Install Cargokit Build Tool Dependencies
        if: steps.filter.outputs.should_build == 'true'
        working-directory: app/flutter/rust_builder/cargokit/build_tool
        run: dart pub get
          
      - name: Build Linux
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter
        run: flutter build linux --release
        
      - name: Compress Linux Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'linux'
        working-directory: app/flutter/build/linux/x64/release/bundle
        run: tar -czvf "$GITHUB_WORKSPACE/qi_flutter_linux.tar.gz" *
        
      - name: Build Android
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64,android-x86
        
      - name: Move Android Build
        if: steps.filter.outputs.should_build == 'true' && matrix.target == 'android'
        working-directory: app/flutter
        run: mv build/app/outputs/flutter-apk/app-release.apk ../../qi_flutter_android.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: steps.filter.outputs.should_build == 'true'
        with:
          files: |
            qi_flutter_linux.tar.gz
            qi_flutter_android.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
