name: Dev Container Image

on:
  pull_request:
    branches: [ master ]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/publish-devcontainer.yml
      - scripts/build_devcontainer_image.sh
      - scripts/publish_devcontainer_image.sh
  push:
    branches: [ master ]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/publish-devcontainer.yml
      - scripts/build_devcontainer_image.sh
      - scripts/publish_devcontainer_image.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Runs only in the template repository, which publishes the shared image
    # that projects created from the template use. A project that publishes its
    # own image replaces this ID with its repository ID (`gh api repos/<owner>/<repo> -q .id`).
    if: github.repository_id == '1379344872'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test toolchain image
        run: bash scripts/build_devcontainer_image.sh
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish versioned image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bash scripts/publish_devcontainer_image.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
