org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- AGP 9 / Kotlin transition flags ---
# These flags are kept at 'false' to prevent ClassCastException in older Flutter plugins
# when preparing for AGP 9. Change to 'true' during the final migration.
android.newDsl=false
android.builtInKotlin=false
